name: MP3-Aigis v0.1.0 One-Click Installers (Fedora RPM, Windows Setup EXE, Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-core:
    name: QA Verification Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Automated Verification Suite
        run: |
          python3 tests/test_suite.py
          python3 run.py --check

  build-fedora-linux:
    name: Build 1. Fedora Linux (.rpm 1-Click Installer & Standalone App)
    needs: verify-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller & RPM Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          pip install pyinstaller
      - name: Build Standalone Binary & Native Fedora .rpm Package
        run: |
          # 1. Compile self-contained Linux binary (includes Python runtime + web + backend)
          pyinstaller --noconfirm --onefile --name mp3-aigis \
            --add-data "web:web" \
            --add-data "backend:backend" \
            run.py

          mkdir -p release-fedora
          cp dist/mp3-aigis release-fedora/MP3-Aigis-0.1.0-Linux-x86_64.bin
          chmod +x release-fedora/MP3-Aigis-0.1.0-Linux-x86_64.bin

          # 2. Prepare rootfs for Fedora .rpm 1-click graphical installer
          mkdir -p rpm-root/opt/mp3-aigis
          mkdir -p rpm-root/usr/bin
          mkdir -p rpm-root/usr/share/applications
          mkdir -p rpm-root/usr/share/icons/hicolor/scalable/apps

          cp dist/mp3-aigis rpm-root/opt/mp3-aigis/mp3-aigis
          chmod 755 rpm-root/opt/mp3-aigis/mp3-aigis
          ln -s /opt/mp3-aigis/mp3-aigis rpm-root/usr/bin/mp3-aigis

          cat << 'ICON' > rpm-root/usr/share/icons/hicolor/scalable/apps/mp3-aigis.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="28" fill="#0b132b"/>
            <circle cx="64" cy="64" r="44" fill="none" stroke="#38bdf8" stroke-width="6"/>
            <polygon points="52,44 88,64 52,84" fill="#f59e0b"/>
          </svg>
          ICON

          cat << 'DESKTOP' > rpm-root/usr/share/applications/mp3-aigis.desktop
          [Desktop Entry]
          Version=1.0
          Name=MP3-Aigis
          GenericName=Reproductor de Música YTMusic & Spotify
          Comment=Reproductor Híbrido YTMusic & Spotify con Liquid Glass, AdBlock y 7 Temas
          Exec=/opt/mp3-aigis/mp3-aigis --desktop
          Icon=mp3-aigis
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;Music;
          StartupNotify=true
          DESKTOP

          # 3. Package into native Fedora RPM (mp3-aigis-0.1.0-1.x86_64.rpm)
          fpm -s dir -t rpm \
            -n mp3-aigis \
            -v 0.1.0 \
            --iteration 1 \
            --architecture x86_64 \
            --license "MIT" \
            --description "MP3-Aigis: Reproductor Hibrido YTMusic y Spotify con Liquid Glass, AdBlock y 7 Temas (Sin requerir Python)" \
            --url "https://github.com/SpeedChela/mp3-aigis" \
            -C rpm-root \
            -p release-fedora/mp3-aigis-0.1.0-1.fedora.x86_64.rpm \
            opt usr
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fedora-linux
          path: |
            release-fedora/mp3-aigis-0.1.0-1.fedora.x86_64.rpm
            release-fedora/MP3-Aigis-0.1.0-Linux-x86_64.bin

  build-windows:
    name: Build 2. Windows Setup Wizard (.exe), Direct (.exe) & Portable (.zip)
    needs: verify-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build Windows Standalone EXE, Portable ZIP & Graphical Inno Setup Wizard
        shell: bash
        run: |
          mkdir -p release-windows

          # 1. Single-file Click-and-Run Executable (No Python needed)
          pyinstaller --noconfirm --onefile --windowed --name "MP3-Aigis-0.1.0-x64" \
            --add-data "web;web" \
            --add-data "backend;backend" \
            run.py
          cp dist/MP3-Aigis-0.1.0-x64.exe release-windows/MP3-Aigis-0.1.0-Ejecutable-Directo-x64.exe

          # 2. Directory build for Windows Setup Wizard & Portable Edition
          pyinstaller --noconfirm --onedir --windowed --name "MP3-Aigis" \
            --add-data "web;web" \
            --add-data "backend;backend" \
            run.py
          cp README.md LICENSE dist/MP3-Aigis/

          # 3. Create Graphical Windows Installer (MP3-Aigis-Setup-0.1.0-x64.exe) via Inno Setup
          cat << 'ISS' > installer.iss
          [Setup]
          AppId={{9F9240A9-4616-4F75-BEB6-8F8D5E8DFF4A}
          AppName=MP3-Aigis
          AppVersion=0.1.0
          AppPublisher=SpeedChela
          AppPublisherURL=https://github.com/SpeedChela/mp3-aigis
          DefaultDirName={autopf}\MP3-Aigis
          DefaultGroupName=MP3-Aigis
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=release-windows
          OutputBaseFilename=MP3-Aigis-Setup-0.1.0-x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "spanish"; MessagesFile: "compiler:Languages\Spanish.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "dist\MP3-Aigis\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\MP3-Aigis"; Filename: "{app}\MP3-Aigis.exe"; Parameters: "--desktop"
          Name: "{autodesktop}\MP3-Aigis"; Filename: "{app}\MP3-Aigis.exe"; Parameters: "--desktop"; Tasks: desktopicon

          [Run]
          Filename: "{app}\MP3-Aigis.exe"; Parameters: "--desktop"; Description: "{cm:LaunchProgram,MP3-Aigis}"; Flags: nowait postinstall skipifsilent
          ISS

          iscc installer.iss

          # 4. Create Zero-Install Windows Portable ZIP (with portable.flag)
          cp -r dist/MP3-Aigis dist/MP3-Aigis-Portable-0.1.0
          touch dist/MP3-Aigis-Portable-0.1.0/portable.flag
          cd dist
          7z a ../release-windows/MP3-Aigis-0.1.0-Portatil-x64.zip MP3-Aigis-Portable-0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: |
            release-windows/MP3-Aigis-Setup-0.1.0-x64.exe
            release-windows/MP3-Aigis-0.1.0-Ejecutable-Directo-x64.exe
            release-windows/MP3-Aigis-0.1.0-Portatil-x64.zip

  build-android-apk:
    name: Build 3. Android APK (1-Click Install)
    needs: verify-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK via Capacitor
        working-directory: platforms/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # Aceptar licencias de Android SDK preinstalado en el runner
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../../../release-android
          cp app/build/outputs/apk/debug/app-debug.apk ../../../release-android/MP3-Aigis-0.1.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: release-android/MP3-Aigis-0.1.0-Android.apk

  publish-release:
    name: Publish Official v0.1.0 Release
    needs: [build-fedora-linux, build-windows, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Platform Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 Checksums & Release Presentation
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat << 'EOF' > RELEASE_NOTES.md
          # MP3-Aigis 0.1.0

          Primera versión pública de **MP3-Aigis**, un cliente ligero de audio para YouTube Music con diseño híbrido inspirado en Spotify y YT Music. Los instalables de esta versión están listos para usar: no requieren instalar Python ni configurar nada por terminal.

          ## Descargas

          | Plataforma | Paquete | Instrucciones |
          |---|---|---|
          | **Fedora Linux** | `mp3-aigis-0.1.0-1.fedora.x86_64.rpm` | Abrir con el gestor de software habitual o `sudo dnf install ./archivo.rpm` |
          | **Linux (Universal)** | `MP3-Aigis-0.1.0-Linux-x86_64.bin` | Dar permisos de ejecución (`chmod +x`) y abrir |
          | **Windows (Instalador)** | `MP3-Aigis-Setup-0.1.0-x64.exe` | Asistente de instalación estándar para Windows 10 y 11 |
          | **Windows (Portátil)** | `MP3-Aigis-0.1.0-Portatil-x64.zip` | Descomprimir en cualquier carpeta o memoria USB y abrir `MP3-Aigis.exe` |
          | **Windows (Directo)** | `MP3-Aigis-0.1.0-Ejecutable-Directo-x64.exe` | Binario único ejecutable sin instalación previa |
          | **Android** | `MP3-Aigis-0.1.0-Android.apk` | Instalar el paquete APK directamente en el dispositivo |

          ## Novedades y características de la versión

          - **Bloqueo automático de publicidad**: el reproductor detecta si la sesión vinculada cuenta con suscripción Premium o no; en caso de ser gratuita, activa el filtrado de anuncios y segmentos patrocinados de forma automática.
          - **Reproducción offline y tolerancia a fallos de red**: las playlists y la cola se guardan localmente para que la música no se corte si la conexión es inestable.
          - **Alternancia entre audio y video**: cambio instantáneo entre la versión en audio y el video oficial de cada tema manteniendo la posición exacta de reproducción.
          - **Ecualizador de 10 bandas y modo inteligente**: incluye ecualización manual con presets y un modo adaptativo que ajusta la curva según el género musical del tema actual.
          - **Perfiles y continuidad entre dispositivos**: soporte para sesiones privadas o modo invitado (para prestar la cuenta sin alterar las recomendaciones personales) y función para retomar la reproducción en otro equipo.
          - **Temas visuales**: interfaz con efecto translúcido y temas dedicados (Aigis, Persona 3 Reload, Persona 5, Sonic, Hatsune Miku, Godzilla y Agnes Tachyon).

          Las sumas de verificación SHA-256 de todos los binarios están disponibles en el archivo adjunto `SHA256SUMS.txt`.
          EOF
      - name: Create or Update GitHub Release v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: "MP3-Aigis 0.1.0"
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/mp3-aigis-0.1.0-1.fedora.x86_64.rpm
            release-assets/MP3-Aigis-0.1.0-Linux-x86_64.bin
            release-assets/MP3-Aigis-Setup-0.1.0-x64.exe
            release-assets/MP3-Aigis-0.1.0-Ejecutable-Directo-x64.exe
            release-assets/MP3-Aigis-0.1.0-Portatil-x64.zip
            release-assets/MP3-Aigis-0.1.0-Android.apk
            release-assets/SHA256SUMS.txt
